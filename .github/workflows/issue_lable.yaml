name: Check Create and Assign Multiple Labels

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest

    steps:

      - name: Check and create labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          LABELS=("automated" "triage" "needs-review")

          for LABEL_NAME in "${LABELS[@]}"; do
            echo "Checking label: $LABEL_NAME"

            if gh label list \
              --repo "$REPO" \
              --limit 100 \
              --json name \
              --jq '.[].name' | grep -Fxq "$LABEL_NAME"
            then
              echo "Label '$LABEL_NAME' already exists."
            else
              echo "Label '$LABEL_NAME' does not exist. Creating it..."

              gh label create "$LABEL_NAME" \
                --repo "$REPO" \
                --description "Automatically created label" \
                --color "1D76DB"
            fi
          done

      - name: Assign labels to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          LABELS=("automated" "triage" "needs-review")

          for LABEL_NAME in "${LABELS[@]}"; do
            echo "Assigning '$LABEL_NAME' to issue #$ISSUE_NUMBER"

            gh issue edit "$ISSUE_NUMBER" \
              --repo "$REPO" \
              --add-label "$LABEL_NAME"
          done
