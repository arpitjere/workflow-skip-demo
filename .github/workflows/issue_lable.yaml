name: Check Create and Assign 

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check and create labels
      - name: Check and create labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LABELS: "automated triage needs-review"
        run: |
          for LABEL_NAME in $LABELS; do

            echo "Checking label: $LABEL_NAME"

            if gh label list \
              --repo "$REPO" \
              --search "$LABEL_NAME" \
              --json name \
              --jq ".[] | select(.name == \"$LABEL_NAME\") | .name" |
              grep -Fxq "$LABEL_NAME"; then

              echo "Label '$LABEL_NAME' already exists."

            else

              echo "Label '$LABEL_NAME' does not exist."
              echo "Creating label '$LABEL_NAME'..."

              gh label create "$LABEL_NAME" \
                --repo "$REPO" \
                --description "Automatically created label" \
                --color "1D76DB"

            fi

          done

      # Step 2: Assign all labels to the issue
      - name: Assign labels to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: "automated triage needs-review"
        run: |
          for LABEL_NAME in $LABELS; do

            echo "Assigning '$LABEL_NAME' to issue #$ISSUE_NUMBER"

            gh issue edit "$ISSUE_NUMBER" \
              --repo "$REPO" \
              --add-label "$LABEL_NAME"
